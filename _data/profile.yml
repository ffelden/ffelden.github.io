short_bio: >-
  <p>
    I am an M.Sc. Physics student at the University of Stuttgart, specializing in simulation methods
    and statistical physics. In my master's thesis at the Institute for Computational Physics
    (Prof. Christian Holm), I research whether the benefit of fine-tuning can be predicted before
    training, using a gradient-based measure. Alongside my studies I work as an ML engineer at
    Marmeladenbaum GmbH. Previously I worked on thermal laser epitaxy at the Max Planck Institute
    for Solid State Research.
  </p>
  <p>
    <strong>Research interests:</strong> predicting fine-tuning outcomes before training &middot;
    evaluation and generalization of ML models.
  </p>

